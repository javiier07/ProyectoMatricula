<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Matrícula - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
      <div class="row w-100 justify-content-center">
        <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6 col-xxl-5">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-primary bg-gradient text-white text-center py-4 px-3 border-0">
              <div class="bg-white bg-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-2">
                <i class="bi bi-mortarboard-fill fs-2"></i>
              </div>
              <h1 class="h3 fw-bold mb-1">Sistema de Matrícula</h1>
              <p class="mb-0 small text-white text-opacity-75">Inicio de Sesión</p>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
              <form action="#" method="post">
                <div class="mb-4">
                  <label for="numeroCuenta" class="form-label fw-semibold">Número de cuenta</label>
                  <div class="input-group input-group-lg">
                    <span class="input-group-text bg-body-tertiary text-primary border-end-0">
                      <i class="bi bi-person-badge"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control bg-body-tertiary border-start-0"
                      id="numeroCuenta"
                      name="numeroCuenta"
                      placeholder="Ingresa tu número de cuenta"
                      inputmode="numeric"
                      required
                    />
                  </div>
                </div>

                <div class="mb-4">
                  <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
                  <div class="input-group input-group-lg">
                    <span class="input-group-text bg-body-tertiary text-primary border-end-0">
                      <i class="bi bi-lock-fill"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control bg-body-tertiary border-start-0"
                      id="contrasena"
                      name="contrasena"
                      placeholder="Ingresa tu contraseña"
                      required
                    />
                  </div>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                  <a href="#" class="link-primary text-decoration-none small fw-semibold">
                    ¿Olvidaste tu contraseña?
                  </a>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary bg-gradient btn-lg fw-semibold rounded-3 shadow-sm py-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
